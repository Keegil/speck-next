<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekend Reading</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Weekend reading</h1>
      <p class="tagline">Pick books, match your hours, enjoy the stack.</p>
    </header>

    <section class="panel budget-panel" aria-labelledby="budget-heading">
      <h2 id="budget-heading">Your weekend</h2>
      <label class="budget-label" for="available-hours">
        Available hours
        <input type="number" id="available-hours" min="0" step="0.5" value="8" inputmode="decimal" />
      </label>
      <div class="budget-summary" role="status" aria-live="polite">
        <div class="budget-row">
          <span>Planned</span>
          <strong id="planned-hours">0</strong>
          <span class="unit">h</span>
        </div>
        <div class="budget-row">
          <span>Available</span>
          <strong id="display-available">8</strong>
          <span class="unit">h</span>
        </div>
        <p id="budget-message" class="budget-message"></p>
        <div class="budget-bar" aria-hidden="true">
          <div id="budget-fill" class="budget-fill"></div>
        </div>
      </div>
    </section>

    <section class="panel add-panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a book</h2>
      <form id="add-form" class="add-form">
        <label>
          Title
          <input type="text" id="title" required autocomplete="off" placeholder="The Left Hand of Darkness" />
        </label>
        <label>
          Author
          <input type="text" id="author" required autocomplete="off" placeholder="Ursula K. Le Guin" />
        </label>
        <label>
          Hours to read
          <input type="number" id="hours" required min="0.25" step="0.25" value="4" inputmode="decimal" />
        </label>
        <button type="submit" class="btn primary">Add book</button>
      </form>
    </section>

    <section class="panel list-panel" aria-labelledby="list-heading">
      <h2 id="list-heading">Library</h2>
      <p id="empty-state" class="empty-state hidden">No books yet. Add one above.</p>
      <ul id="book-list" class="book-list"></ul>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
